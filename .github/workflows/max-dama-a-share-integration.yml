name: Max Dama A-share research integration

on:
  pull_request:
    paths:
      - "agent/src/tools/a_share_rank_research_tool.py"
      - "agent/src/tools/max_dama_research_tool.py"
      - "agent/tests/test_a_share_rank_research_tool.py"
      - "agent/tests/test_max_dama_research_tool.py"
      - "examples/a_share_rank_research_adapter/**"
      - "examples/max_dama_research_protocol/**"
      - ".github/workflows/max-dama-a-share-integration.yml"
  workflow_dispatch:

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Vibe development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused integration tests
        env:
          PYTHONPATH: agent
        run: |
          python -m pytest \
            agent/tests/test_a_share_rank_research_tool.py \
            agent/tests/test_max_dama_research_tool.py \
            -q

      - name: Check Python and shell syntax
        env:
          PYTHONPATH: agent
        run: |
          python -m py_compile \
            agent/src/tools/a_share_rank_research_tool.py \
            agent/src/tools/max_dama_research_tool.py
          bash -n examples/a_share_rank_research_adapter/setup.sh
          bash -n examples/max_dama_research_protocol/setup.sh
